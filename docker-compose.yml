services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: maplocation
      MARIADB_USER: maplocation
      MARIADB_PASSWORD: maplocation
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # mysqladmin ping -u root -p... 은 mariadb 이미지에서 root가 unix_socket 인증을 쓰는
      # 경우 비밀번호를 무시하고 실패할 수 있어서, 공식 이미지가 제공하는 healthcheck.sh를 사용한다
      # (내부적으로 전용 healthcheck 계정을 자동 생성해 인증 문제 없이 TCP 연결을 확인함).
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://maplocation:maplocation@db:3306/maplocation?charset=utf8mb4
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"

volumes:
  db_data:
